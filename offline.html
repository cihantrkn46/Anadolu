<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0907">
  <title>Çevrimdışı — Anadolu ai</title>
  <link rel="stylesheet" href="./styles/main.css">
  <style>
    body { align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .offline-card {
      max-width: 360px;
      padding: 28px 22px;
      border-radius: 20px;
      border: 1px solid rgba(224,133,56,0.3);
      background: rgba(38,22,16,0.95);
    }
    h1 { font-family: Cinzel, serif; color: var(--bakir); font-size: 1.2rem; margin-bottom: 12px; }
    p { font-family: Amiri, serif; color: var(--yazi-ara); line-height: 1.6; margin-bottom: 20px; }
    a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--bakir), var(--bakir-koyu));
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-family: Nunito, sans-serif;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <h1>Bağlantı Yok</h1>
    <p>Yoldaşım, şu an çevrimdışısın. Önbelleğe alınmış sohbet ekranına dönebilir veya bağlantı gelince yeniden deneyebilirsin.</p>
    <a href="./index.html">Uygulamaya Dön</a>
  </div>
</body>
</html>
